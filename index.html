<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>WILLISFACE :: DO THEY LOOK ALIKE?</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <h1 class="title">WILLISFACE</h1>
  <div class="subtitle">DO THEY LOOK ALIKE?</div>

  <div class="compare-box">
    <div id="comparePane" class="compare-pane" style="--split:50%">
      <canvas id="cv1" class="compare-img base"></canvas>
      <canvas id="cv2" class="compare-img top"></canvas>
      <div class="compare-divider"></div>
    </div>
    <input id="splitSlider" class="split-slider" type="range" min="0" max="100" value="50" step="0.1" />
    <div class="compare-names">
      <span id="name1" class="name-left">—</span>
      <span id="name2" class="name-right">—</span>
    </div>
    <div class="compare-tools">
      <button id="alignBtn" class="btn-mini" type="button">ALIGN: ON</button>
    </div>
  </div>

  <div id="nextPick" class="next-pick">TAP A FACE TO PICK THE LEFT SIDE</div>

  <div id="roster" class="roster"></div>

  <script type="module" src="./js/select.js"></script>
</body>
</html>
