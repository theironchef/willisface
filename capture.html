<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>WILLISFACE :: CAPTURE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body class="capture-page">
  <div class="capture-title">PHOTO FOR <span id="who" class="capture-name">?</span></div>

  <div class="viewport" id="viewport">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>
    <svg class="overlay-svg" viewBox="0 0 300 400" preserveAspectRatio="xMidYMid meet">
      <!-- horizontal eye line -->
      <line x1="58" y1="198" x2="242" y2="198" stroke="#00f0ff" stroke-width="2" stroke-dasharray="6 4" opacity="0.9"/>
      <text x="38" y="201" fill="#00f0ff" font-family="'Press Start 2P', monospace" font-size="8" opacity="0.95">EYES</text>
      <!-- vertical center line -->
      <line x1="150" y1="20" x2="150" y2="380" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6"/>
    </svg>
  </div>

  <div id="status" class="status">ALIGN FACE INSIDE THE OVAL</div>

  <div class="controls">
    <button id="snapBtn" class="btn">SNAP</button>
    <button id="retakeBtn" class="btn secondary" hidden>RETAKE</button>
    <button id="useBtn" class="btn" hidden>USE THIS</button>
  </div>

  <div class="controls">
    <button id="flipBtn" class="btn secondary">FLIP CAM</button>
    <a class="btn secondary" href="./index.html">BACK</a>
  </div>

  <script type="module" src="./js/capture.js"></script>
</body>
</html>
