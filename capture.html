<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>WILLISFACE :: CAPTURE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body class="capture-page">
  <div class="capture-title">PHOTO FOR <span id="who" class="capture-name">?</span></div>

  <div class="viewport" id="viewport">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>
    <svg class="overlay-svg" viewBox="0 0 300 400" preserveAspectRatio="xMidYMid meet">
      <defs>
        <mask id="cutout">
          <rect width="300" height="400" fill="white"/>
          <ellipse cx="150" cy="170" rx="92" ry="118" fill="black"/>
        </mask>
      </defs>
      <!-- darken outside the oval -->
      <rect width="300" height="400" fill="rgba(0,0,0,0.45)" mask="url(#cutout)"/>
      <!-- oval guide -->
      <ellipse cx="150" cy="170" rx="92" ry="118"
               fill="none" stroke="#ffd400" stroke-width="3" stroke-dasharray="6 4"/>
      <!-- eye target circles + faint line -->
      <line x1="58" y1="148" x2="242" y2="148" stroke="#00f0ff" stroke-width="1" stroke-dasharray="3 5" opacity="0.45"/>
      <circle cx="112" cy="148" r="13" fill="rgba(0,240,255,0.08)" stroke="#00f0ff" stroke-width="2.5" opacity="0.95"/>
      <circle cx="188" cy="148" r="13" fill="rgba(0,240,255,0.08)" stroke="#00f0ff" stroke-width="2.5" opacity="0.95"/>
      <text x="38" y="151" fill="#00f0ff" font-family="'Press Start 2P', monospace" font-size="8" opacity="0.95">EYES</text>
      <!-- chin cradle (U shape) -->
      <path d="M118,260 Q150,290 182,260" fill="none" stroke="#ff2e88" stroke-width="2.5" opacity="0.95"/>
      <text x="186" y="278" fill="#ff2e88" font-family="'Press Start 2P', monospace" font-size="8" opacity="0.95">CHIN</text>
      <!-- vertical center line for L/R alignment -->
      <line x1="150" y1="40" x2="150" y2="350" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.55"/>
      <text x="154" y="50" fill="#ffffff" font-family="'Press Start 2P', monospace" font-size="8" opacity="0.7">CENTER</text>
      <!-- corner crosshairs -->
      <g stroke="#ffd400" stroke-width="2" fill="none">
        <path d="M10,10 H30 M10,10 V30"/>
        <path d="M290,10 H270 M290,10 V30"/>
        <path d="M10,390 H30 M10,390 V370"/>
        <path d="M290,390 H270 M290,390 V370"/>
      </g>
    </svg>
  </div>

  <div id="status" class="status">ALIGN FACE INSIDE THE OVAL</div>

  <div class="controls">
    <button id="snapBtn" class="btn">SNAP</button>
    <button id="retakeBtn" class="btn secondary" hidden>RETAKE</button>
    <button id="useBtn" class="btn" hidden>USE THIS</button>
  </div>

  <div class="controls">
    <button id="flipBtn" class="btn secondary">FLIP CAM</button>
    <a class="btn secondary" href="./index.html">BACK</a>
  </div>

  <script type="module" src="./js/capture.js"></script>
</body>
</html>
